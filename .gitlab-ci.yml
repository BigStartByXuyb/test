# 插件市场仓库的流水线入口：逻辑在 CI 实现仓库（cicd）里，这里只做引用与钉版本。
#
# 这三处的 ref 必须是同一个 commit：换任意一处就等于换了这一版的流水线逻辑。
# 密钥不写在这里：CI/CD 变量在本仓库的 Settings → CI/CD → Variables（作用域 plugin-cicd）。
include:
  - project: data_ai/cicd
    ref: 07c7f3d5f76f742ebd93e1138254b921ef44964b
    file: /templates/common.yml
  - project: data_ai/cicd
    ref: 07c7f3d5f76f742ebd93e1138254b921ef44964b
    file: /templates/plugin-marketplace.yml

variables:
  CI_IMPL_REF: 07c7f3d5f76f742ebd93e1138254b921ef44964b
