name: Plugin CI/CD

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-cicd.yml'
  # 只在 PR 与 main 上跑：审计那一关要 PR 的改动上下文，在 tag 上跑不出有效报告。
  # tag 上发发布件那条在 plugin-release.yml：它按 tag 打包、核对该 tag 里的插件版本与包内容。
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plugin-ci:
    uses: BigStartByXuyb/cicd/.github/workflows/plugin-marketplace.yml@e9cc5b0186b853060dd6f8013541b617603ff194
    with:
      ci_ref: e9cc5b0186b853060dd6f8013541b617603ff194
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_DEFAULT_CHAT_ID: ${{ secrets.FEISHU_DEFAULT_CHAT_ID }}
      FEISHU_RECIPIENT_MAP_JSON: ${{ secrets.FEISHU_RECIPIENT_MAP_JSON }}
