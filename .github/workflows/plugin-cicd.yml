name: Plugin CI/CD

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'docs/plugin-semantic-audit.md'
      - '.github/workflows/plugin-cicd.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'docs/plugin-semantic-audit.md'
      - '.github/workflows/plugin-cicd.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plugin-ci:
    uses: BigStartByXuyb/cicd/.github/workflows/plugin-marketplace.yml@b42ae11ce9dcee735a4dd9ea0d01657e078e6557
    with:
      ci_ref: b42ae11ce9dcee735a4dd9ea0d01657e078e6557
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_DEFAULT_CHAT_ID: ${{ secrets.FEISHU_DEFAULT_CHAT_ID }}
      FEISHU_RECIPIENT_MAP_JSON: ${{ secrets.FEISHU_RECIPIENT_MAP_JSON }}
