name: Plugin CI/CD

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-cicd.yml'
  # 只在 PR 与 main 上跑：审计那一关要 PR 的改动上下文，在 tag 上跑不出有效报告。
  # 发版校验在客户端那边做 —— 它按 tag 打包时会核对该 tag 里的插件版本与包内容。
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plugin-ci:
    uses: BigStartByXuyb/cicd/.github/workflows/plugin-marketplace.yml@fb3c1072384c5a809ac79c4ad7869aa2ffb7aae7
    with:
      ci_ref: fb3c1072384c5a809ac79c4ad7869aa2ffb7aae7
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_DEFAULT_CHAT_ID: ${{ secrets.FEISHU_DEFAULT_CHAT_ID }}
      FEISHU_RECIPIENT_MAP_JSON: ${{ secrets.FEISHU_RECIPIENT_MAP_JSON }}
