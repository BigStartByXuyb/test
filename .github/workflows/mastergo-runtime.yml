name: MasterGo runtime tests

on:
  pull_request:
    paths: ['plugins/mastergo-wpf-transcoder/**', '.github/workflows/mastergo-runtime.yml']
  push:
    branches: [main, 'review/mastergo-pipeline-boundaries-20260922']
    paths: ['plugins/mastergo-wpf-transcoder/**', '.github/workflows/mastergo-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mastergo-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Complete Node and PowerShell regressions
        shell: pwsh
        run: |
          node plugins/mastergo-wpf-transcoder/skills/mastergo-to-wpf/scripts/test-runtime.mjs
          exit $LASTEXITCODE
